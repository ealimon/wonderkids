name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform (ignoring initial pod install failure)
          npx cap add ios || true
          
          # Write robust Podfile with iOS 15.0+ target (required by modern Capacitor)
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          # workaround to avoid Xcode caching of Pods that requires
          # Product -> Clean Build Folder after new Cordova plugins installed
          # Requires CocoaPods 1.6 or newer
          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
            # Add your Pods here
          end

          post_install do |installer|
            assertDeploymentTarget(installer)
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # Copy web build assets to iOS app
          npx cap copy ios
          
          # Install CocoaPods dependencies with iOS 15.0 target
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Setup App Store Connect API Key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys

          # Format and write the .p8 file cleanly
          node -e '
            const fs = require("fs");
            let raw = (process.env.KEY_P8 || "").trim();
            const keyId = (process.env.KEY_ID || "").trim();

            if (!raw) {
              console.error("APP_STORE_CONNECT_KEY_P8 secret is empty!");
              process.exit(1);
            }

            // Remove any potential quotes or escaped newlines
            raw = raw.replace(/^["\x27]|["\x27]$/g, "").replace(/\\n/g, "\n").trim();

            // Extract only the base64 content
            let b64 = raw
              .replace(/-----BEGIN [^-]+-----/g, "")
              .replace(/-----END [^-]+-----/g, "")
              .replace(/\s+/g, "");

            // If user pasted a base64 encoded string of the whole PEM
            if (b64.length > 500) {
              try {
                const decoded = Buffer.from(b64, "base64").toString("utf-8");
                if (decoded.includes("BEGIN")) {
                  b64 = decoded
                    .replace(/-----BEGIN [^-]+-----/g, "")
                    .replace(/-----END [^-]+-----/g, "")
                    .replace(/\s+/g, "");
                }
              } catch(e) {}
            }

            // Chunk in strict 64-char lines
            const chunks = b64.match(/.{1,64}/g) || [];
            const standardPem = `-----BEGIN PRIVATE KEY-----\n${chunks.join("\n")}\n-----END PRIVATE KEY-----\n`;

            const path1 = `${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${keyId}.p8`;
            const path2 = `${process.env.HOME}/.private_keys/AuthKey_${keyId}.p8`;

            fs.writeFileSync(path1, standardPem, { mode: 0o600 });
            fs.writeFileSync(path2, standardPem, { mode: 0o600 });
            console.log(`Saved AuthKey_${keyId}.p8 successfully (${chunks.length} PEM chunks).`);
          '

      - name: Build Xcode Archive & Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App
          # Bump version
          xcrun agvtool new-version -all ${{ github.run_number }} || true

          CLEAN_KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]')

          # 1. Archive the project
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID" \
            archive

          # 2. Export Archive to IPA
          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"

          # 3. Upload to TestFlight / App Store
          IPA_FILE=$(find build/Export -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          
          if [ -n "$IPA_FILE" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID" \
              --keyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          fi
