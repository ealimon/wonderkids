name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Setup Official Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform
          npx cap add ios || true
          
          # Write clean Podfile targeting iOS 15.0
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer) rescue nil
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # Copy web build assets to iOS app
          npx cap copy ios

          # Update deployment target, bundle ID, and build version
          node -e '
            const fs = require("fs");
            const pbxPath = "ios/App/App.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbxPath)) {
              let content = fs.readFileSync(pbxPath, "utf-8");
              content = content.replace(/PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;/g, "PRODUCT_BUNDLE_IDENTIFIER = com.limon.storybookeducation;");
              content = content.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/g, "IPHONEOS_DEPLOYMENT_TARGET = 15.0;");
              content = content.replace(/CURRENT_PROJECT_VERSION\s*=\s*[0-9.]+;/g, "CURRENT_PROJECT_VERSION = ${{ github.run_number }};");
              fs.writeFileSync(pbxPath, content);
              console.log("✅ Configured Bundle ID com.limon.storybookeducation and build version ${{ github.run_number }}");
            }
          '

          # Install CocoaPods
          cd ios/App
          pod install --repo-update || pod install

      - name: Setup App Store Connect API Key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys

          node -e '
            const fs = require("fs");
            let raw = (process.env.KEY_P8 || "").trim();
            const keyId = (process.env.KEY_ID || "").trim();

            if (!raw) {
              console.error("APP_STORE_CONNECT_KEY_P8 secret is empty!");
              process.exit(1);
            }

            raw = raw.replace(/^["\x27]|["\x27]$/g, "").replace(/\\n/g, "\n").trim();
            let b64 = raw
              .replace(/-----BEGIN [^-]+-----/g, "")
              .replace(/-----END [^-]+-----/g, "")
              .replace(/\s+/g, "");

            if (b64.length > 500) {
              try {
                const decoded = Buffer.from(b64, "base64").toString("utf-8");
                if (decoded.includes("BEGIN")) {
                  b64 = decoded
                    .replace(/-----BEGIN [^-]+-----/g, "")
                    .replace(/-----END [^-]+-----/g, "")
                    .replace(/\s+/g, "");
                }
              } catch(e) {}
            }

            const chunks = b64.match(/.{1,64}/g) || [];
            const standardPem = `-----BEGIN PRIVATE KEY-----\n${chunks.join("\n")}\n-----END PRIVATE KEY-----\n`;

            const path1 = `${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${keyId}.p8`;
            const path2 = `${process.env.HOME}/.private_keys/AuthKey_${keyId}.p8`;

            fs.writeFileSync(path1, standardPem, { mode: 0o600 });
            fs.writeFileSync(path2, standardPem, { mode: 0o600 });
            console.log(`✅ Saved AuthKey_${keyId}.p8 successfully.`);
          '

      - name: Build Xcode Archive & Package IPA
        run: |
          cd ios/App

          # 1. Clean Archive
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

          # 2. Package App.xcarchive into App.ipa directly
          mkdir -p build/Export/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Export/Payload/
          cd build/Export
          zip -qry App.ipa Payload
          cd ../../
          echo "✅ Successfully created App.ipa at ios/App/build/Export/App.ipa"

      - name: Save IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-IPA
          path: ios/App/build/Export/App.ipa

      - name: Deliver to App Store Connect / TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App
          CLEAN_KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]')
          IPA_PATH="build/Export/App.ipa"

          echo "🚀 Delivering $IPA_PATH to App Store Connect (com.limon.storybookeducation)..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$CLEAN_KEY_ID" \
            --apiIssuer "$CLEAN_ISSUER_ID"
