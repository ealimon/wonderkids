name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Setup Official Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform
          npx cap add ios || true
          
          # Write clean Podfile targeting iOS 15.0
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer) rescue nil
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # Copy web build assets to iOS app
          npx cap copy ios

          # Update deployment target and set build number in Xcode project
          node -e '
            const fs = require("fs");
            const pbxPath = "ios/App/App.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbxPath)) {
              let content = fs.readFileSync(pbxPath, "utf-8");
              content = content.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/g, "IPHONEOS_DEPLOYMENT_TARGET = 15.0;");
              content = content.replace(/CURRENT_PROJECT_VERSION\s*=\s*[0-9.]+;/g, "CURRENT_PROJECT_VERSION = ${{ github.run_number }};");
              fs.writeFileSync(pbxPath, content);
              console.log("✅ Configured IPHONEOS_DEPLOYMENT_TARGET and build version ${{ github.run_number }}");
            }
          '

          # Install CocoaPods
          cd ios/App
          pod install --repo-update || pod install

      - name: Setup App Store Connect API Key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPLICIT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys

          node -e '
            (async () => {
              const fs = require("fs");
              const crypto = require("crypto");
              const https = require("https");

              let raw = (process.env.KEY_P8 || "").trim();
              const keyId = (process.env.KEY_ID || "").trim();
              const issuerId = (process.env.ISSUER_ID || "").trim();
              let teamId = (process.env.EXPLICIT_TEAM_ID || "").trim();

              if (!raw) {
                console.error("APP_STORE_CONNECT_KEY_P8 secret is empty!");
                process.exit(1);
              }

              raw = raw.replace(/^["\x27]|["\x27]$/g, "").replace(/\\n/g, "\n").trim();
              let b64 = raw
                .replace(/-----BEGIN [^-]+-----/g, "")
                .replace(/-----END [^-]+-----/g, "")
                .replace(/\s+/g, "");

              if (b64.length > 500) {
                try {
                  const decoded = Buffer.from(b64, "base64").toString("utf-8");
                  if (decoded.includes("BEGIN")) {
                    b64 = decoded
                      .replace(/-----BEGIN [^-]+-----/g, "")
                      .replace(/-----END [^-]+-----/g, "")
                      .replace(/\s+/g, "");
                  }
                } catch(e) {}
              }

              const chunks = b64.match(/.{1,64}/g) || [];
              const standardPem = `-----BEGIN PRIVATE KEY-----\n${chunks.join("\n")}\n-----END PRIVATE KEY-----\n`;

              const path1 = `${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${keyId}.p8`;
              const path2 = `${process.env.HOME}/.private_keys/AuthKey_${keyId}.p8`;

              fs.writeFileSync(path1, standardPem, { mode: 0o600 });
              fs.writeFileSync(path2, standardPem, { mode: 0o600 });
              console.log(`✅ Saved AuthKey_${keyId}.p8 successfully.`);

              function base64Url(obj) {
                return Buffer.from(JSON.stringify(obj)).toString("base64")
                  .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
              }

              if (!teamId) {
                try {
                  const header = { alg: "ES256", kid: keyId, typ: "JWT" };
                  const payload = {
                    iss: issuerId,
                    exp: Math.floor(Date.now() / 1000) + 600,
                    aud: "appstoreconnect-v1"
                  };

                  const signData = `${base64Url(header)}.${base64Url(payload)}`;
                  const sign = crypto.createSign("SHA256");
                  sign.update(signData);
                  const signature = sign.sign({ key: standardPem, dsaEncoding: "ieee-p1363" }, "base64")
                    .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
                  const token = `${signData}.${signature}`;

                  const res = await new Promise((resolve, reject) => {
                    const req = https.get("https://api.appstoreconnect.apple.com/v1/bundleIds", {
                      headers: { "Authorization": `Bearer ${token}` }
                    }, (response) => {
                      let data = "";
                      response.on("data", chunk => data += chunk);
                      response.on("end", () => {
                        try { resolve(JSON.parse(data)); } catch(e) { resolve({}); }
                      });
                    });
                    req.on("error", reject);
                  });

                  if (res.data && res.data.length > 0) {
                    for (const item of res.data) {
                      if (item.attributes && item.attributes.seedId) {
                        teamId = item.attributes.seedId;
                        console.log(`✅ Found Apple Team ID from App Store Connect: ${teamId}`);
                        break;
                      }
                    }
                  }
                } catch (e) {
                  console.warn("Could not query App Store Connect API for Team ID:", e.message);
                }
              }

              if (teamId) {
                fs.appendFileSync(process.env.GITHUB_ENV, `\nAPPLE_TEAM_ID=${teamId}\n`);
              }

              const pbxPath = "ios/App/App.xcodeproj/project.pbxproj";
              if (fs.existsSync(pbxPath)) {
                let pbx = fs.readFileSync(pbxPath, "utf-8");
                pbx = pbx.replace(/ProvisioningStyle = Automatic;/g, "ProvisioningStyle = Manual;");
                pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, "CODE_SIGN_STYLE = Manual;");
                if (teamId) {
                  pbx = pbx.replace(/buildSettings = \{/g, `buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = ${teamId};\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tIPHONEOS_DEPLOYMENT_TARGET = 15.0;`);
                }
                fs.writeFileSync(pbxPath, pbx);
                console.log(`✅ Configured project.pbxproj.`);
              }
            })();
          '

      - name: Build & Deliver to TestFlight via Fastlane
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          CLEAN_KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"

          # Fastlane build_app with automatic App Store Connect signing and export
          fastlane run build_app \
            workspace:"App.xcworkspace" \
            scheme:"App" \
            clean:true \
            export_method:"app-store" \
            output_directory:"build/Export" \
            output_name:"App.ipa" \
            skip_profile_detection:true \
            xcargs:"IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

          IPA_PATH="build/Export/App.ipa"

          if [ -f "$IPA_PATH" ]; then
            echo "🚀 Delivering $IPA_PATH directly to TestFlight..."
            fastlane run upload_to_testflight \
              ipa:"$IPA_PATH" \
              api_key_path:"$KEY_PATH" \
              api_key_id:"$CLEAN_KEY_ID" \
              api_issuer_id:"$CLEAN_ISSUER_ID" \
              skip_waiting_for_build_processing:true
          else
            echo "::error::IPA export failed"
            exit 1
          fi

      - name: Save IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-IPA
          path: ios/App/build/Export/*.ipa
          if-no-files-found: ignore
