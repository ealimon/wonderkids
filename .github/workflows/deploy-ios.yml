name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - name: Select Xcode 16 SDK
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
            echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform
          npx cap add ios || true
          
          # Write Podfile with iOS 15.0+ target
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer) rescue nil
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          EOF

          # Reinstall CocoaPods
          cd ios/App
          pod repo update || true
          pod install --repo-update || pod install

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          CLEAN_KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d ' \n\r\t')
          CLEAN_ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d ' \n\r\t')

          if [ -z "$CLEAN_KEY_ID" ] || [ -z "$CLEAN_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_P8" ]; then
            echo "::error::Missing App Store Connect API credentials in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8

          mkdir -p ~/.private_keys
          cp ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 ~/.private_keys/

          echo "✅ App Store Connect API key installed."

      - name: Build Xcode Archive & Export IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App

          CLEAN_KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d ' \n\r\t')
          CLEAN_ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d ' \n\r\t')
          CLEAN_TEAM_ID=$(echo "$APPLE_TEAM_ID" | tr -d ' \n\r\t')

          node -e "
            const fs = require('fs');
            const pbxPath = 'App.xcodeproj/project.pbxproj';
            if (fs.existsSync(pbxPath)) {
              let pbx = fs.readFileSync(pbxPath, 'utf8');
              const teamId = '$CLEAN_TEAM_ID';
              
              pbx = pbx.replace(/CODE_SIGN_STYLE = Manual;/g, 'CODE_SIGN_STYLE = Automatic;');
              pbx = pbx.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/g, 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;');
              
              if (teamId) {
                pbx = pbx.replace(/buildSettings = \{/g, 'buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = ' + teamId + ';\n\t\t\t\tCODE_SIGN_STYLE = Automatic;\n\t\t\t\tIPHONEOS_DEPLOYMENT_TARGET = 15.0;');
              }
              fs.writeFileSync(pbxPath, pbx);
              console.log('✅ Configured project.pbxproj with DEVELOPMENT_TEAM: ' + teamId);
            }
          "

          # 1. Archive specifically for generic iOS platform for App Store
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID" \
            archive

          # 2. Export IPA
          cat << EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            ${CLEAN_TEAM_ID:+<key>teamID</key><string>$CLEAN_TEAM_ID</string>}
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"

          # 3. Upload to App Store Connect
          IPA_FILE=$(find build/Export -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          
          if [ -n "$IPA_FILE" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID"
          fi
