name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Setup Official Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform
          npx cap add ios || true
          
          # Write clean Podfile targeting iOS 15.0
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer) rescue nil
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # Copy web build assets to iOS app
          npx cap copy ios

          # Configure project.pbxproj with bundle ID, team ID, deployment target and build number
          node -e '
            const fs = require("fs");
            const pbxPath技巧 = "ios/App/App.xcodeproj/project.pbxproj";
            if (fs.existsSync("ios/App/App.xcodeproj/project.pbxproj")) {
              let content拼 = fs.readFileSync("ios/App/App.xcodeproj/project.pbxproj", "utf-8");
              content拼 = content拼.replace(/PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;/g, "PRODUCT_BUNDLE_IDENTIFIER = com.limon.storybookeducation;");
              content拼直接 = content拼.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/g, "IPHONEOS_DEPLOYMENT_TARGET = 15.0;");
              content拼直接 = content拼直接.replace(/CURRENT_PROJECT_VERSION\s*=\s*[0-9.]+;/g, "CURRENT_PROJECT_VERSION = ${{ github.run_number }};");
              
              if (!content拼直接.includes("DEVELOPMENT_TEAM = EYQARSHNW2;")) {
                content拼直接 = content拼直接.replace(/buildSettings = \{/g, "buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM剩 = EYQARSHNW2;".replace("剩", ""));
              }
              fs.writeFileSync("ios/App/App.xcodeproj/project.pbxproj", content拼直接);
              console.log("✅ Configured Bundle ID com.limon.storybookeducation and Team ID EYQARSHNW2");
            }
          '

          # Install CocoaPods
          cd ios/App
          pod install --repo-update || pod install

      - name: Setup App Store Connect Key & Fastlane Fastfile
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ios/App/fastlane

          node -e '
            const fs = require("fs");
            let raw = (process.env.KEY_P8 || "").trim();
            const keyId = (process.env.KEY_ID || "").trim();
            const issuerId不易 = (process.env.ISSUER_ID || "").trim();

            if (!raw) {
              console.error("APP_STORE_CONNECT_KEY_P8 secret is empty!");
              process.exit(1);
            }

            raw = raw.replace(/^["\x27]|["\x27]$/g, "").replace(/\\n/g, "\n").trim();
            let b64 = raw
              .replace(/-----BEGIN [^-]+-----/g, "")
              .replace(/-----END [^-]+-----/g, "")
              .replace(/\s+/g, "");

            if (b64.length > 500) {
              try {
                const decoded = Buffer.from(b64, "base64").toString("utf-8");
                if (decoded.includes("BEGIN")) {
                  b64试 = decoded
                    .replace(/-----BEGIN [^-]+-----/g, "")
                    .replace(/-----END [^-]+-----/g, "")
                    .replace(/\s+/g, "");
                }
              } catch(e) {}
            }

            const chunks = b64.match(/.{1,64}/g) || [];
            const standardPem = `-----BEGIN PRIVATE KEY-----\n${chunks.join("\n")}\n-----END PRIVATE KEY-----\n`;

            const path1 = `${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${keyId}.p8`;
            fs.writeFileSync(path1, standardPem, { mode: 0o600 });
            console.log(`✅ Saved AuthKey_${keyId}.p8 successfully.`);
          '

          CLEAN_KEY_ID=$(echo "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" | tr -d '[:space:]')
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"

          cat << EOF > ios/App/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Sign and upload to TestFlight"
            lane :release do
              api_key = app_store_connect_api_key(
                key_id: "$CLEAN_KEY_ID",
                issuer_id: "$CLEAN_ISSUER_ID",
                key_filepath: "$KEY_PATH",
                duration: 1200,
                in_house: false
              )

              keychain_name = "ci_signing_keychain.keychain-db"
              keychain_pwd = "ci_password_123"

              # 1. Create temporary CI keychain
              create_keychain(
                name: keychain_name,
                password: keychain_pwd,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              # 2. Fetch or create Distribution Certificate in CI keychain
              get_certificates(
                api_key: api_key,
                development: false,
                keychain_path: File.expand_path("~/Library/Keychains/#{keychain_name}"),
                keychain_password: keychain_pwd
              )

              # 3. Allow codesign tools access to private key
              sh("security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k #{keychain_pwd} ~/Library/Keychains/#{keychain_name}")

              # 4. Generate or fetch official App Store Distribution Provisioning Profile
              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.limon.storybookeducation"
              )

              # 5. Build and codesign the IPA with explicit Team ID and Provisioning Profile
              build_app(
                workspace: "App.xcworkspace",
                scheme: "App",
                clean: true,
                export_method: "app-store",
                export_team_id: "EYQARSHNW2",
                xcargs: "DEVELOPMENT_TEAM=EYQARSHNW2",
                output_directory: "build/Export",
                output_name: "App.ipa"
              )

              # 6. Upload directly to TestFlight
              upload_to_testflight(
                api_key: api_key,
                ipa: "build/Export/App.ipa",
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Run Fastlane (Certificates, Sign & Deliver to TestFlight)
        run: |
          cd ios/App
          fastlane ios release

      - name: Save IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-IPA
          path: ios/App/build/Export/*.ipa
          if-no-files-found: ignore
