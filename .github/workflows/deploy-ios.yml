name: Build and Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize and Configure iOS Project
        run: |
          npm install -g @capacitor/cli
          npm install --save @capacitor/core @capacitor/ios
          
          # Initialize iOS platform
          npx cap add ios || true

          # Write Podfile targeting iOS 15.0
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer) rescue nil
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # Sync web assets
          npx cap sync ios

          # Install CocoaPods
          cd ios/App
          pod install --repo-update || pod install

      - name: Setup App Store Connect API Key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys

          CLEAN_KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]')
          CLEAN_TEAM_ID=$(echo "$APPLE_TEAM_ID" | tr -d '[:space:]')

          # Save API key file
          echo "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 ~/.private_keys/

          # Configure project.pbxproj
          node -e "
            const fs = require('fs');
            const pbxPath = 'ios/App/App.xcodeproj/project.pbxproj';
            if (fs.existsSync(pbxPath)) {
              let pbx = fs.readFileSync(pbxPath, 'utf8');
              const teamId = '$CLEAN_TEAM_ID';
              pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
              if (teamId) {
                pbx = pbx.replace(/buildSettings = \{/g, 'buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = ' + teamId + ';\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;');
              }
              fs.writeFileSync(pbxPath, pbx);
              console.log('✅ Configured project.pbxproj.');
            }
          "

      - name: Build Xcode Archive & Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App

          CLEAN_KEY_ID=$(echo "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '[:space:]')
          CLEAN_TEAM_ID=$(echo "$APPLE_TEAM_ID" | tr -d '[:space:]')

          # 1. Archive unencumbered by device profiles (Proven from Run #38)
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # 2. Export IPA
          cat << EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            ${CLEAN_TEAM_ID:+<key>teamID</key><string>$CLEAN_TEAM_ID</string>}
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8 \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"

          # 3. Modern App Store Connect Upload via xcrun notarytool/altool
          IPA_FILE=$(find build/Export -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          
          if [ -n "$IPA_FILE" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID"
          fi
